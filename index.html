<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temario Bombero · Almería</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%92%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<!-- Firebase (login con Google + registro con aprobación + sincronización de progreso + avisos).
     Si FIREBASE_CONFIG no está rellenado en app.js, todo esto se desactiva solo y la app
     sigue funcionando igual que siempre con nombre+PIN y progreso solo en este dispositivo. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="gate-overlay"></div>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Temario Bombero · Almería</h1>
      <input id="search-box" type="text" placeholder="Buscar en todo el temario…">
    </div>
    <div id="nav-tabs">
      <select id="nav-select" class="nav-select">
        <option value="temario">📘 Temario</option>
        <option value="test">📝 Test</option>
        <option value="flashcards">🗂️ Flashcards</option>
        <option value="plan">📅 Plan</option>
        <option value="progreso">📊 Progreso</option>
        <option value="admin" id="nav-option-admin" style="display:none">⚙️ Admin</option>
      </select>
    </div>
    <div id="tema-list"></div>
  </div>
  <div id="main-col">
    <div id="persona-bar"></div>
    <div id="avisos-panel" class="avisos-panel" style="display:none"></div>
    <div id="main">
      <div id="view-temario" class="view"><div id="content-wrap"></div></div>
      <div id="view-test" class="view" style="display:none"></div>
      <div id="view-flashcards" class="view" style="display:none"></div>
      <div id="view-plan" class="view" style="display:none"></div>
      <div id="view-progreso" class="view" style="display:none"></div>
      <div id="view-admin" class="view" style="display:none"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
